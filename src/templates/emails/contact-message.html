<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New contact message</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1a202c;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="background:#2b6cb0;padding:24px 32px;color:#ffffff;font-size:20px;font-weight:bold;">
                Indian Health System
              </td>
            </tr>
            <tr>
              <td style="padding:32px;">
                <p style="margin:0 0 16px;font-size:16px;font-weight:bold;">New contact message</p>
                <p style="margin:0 0 8px;"><strong>Name:</strong> {{name}}</p>
                <p style="margin:0 0 8px;"><strong>Email:</strong>
                  <a href="mailto:{{email}}" style="color:#2b6cb0;">{{email}}</a>
                </p>
                <p style="margin:0 0 8px;"><strong>Phone:</strong> {{phone}}</p>
                <p style="margin:20px 0 6px;color:#718096;font-size:13px;text-transform:uppercase;letter-spacing:.5px;">Message</p>
                <p style="margin:0;white-space:pre-wrap;line-height:1.6;">{{message}}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
